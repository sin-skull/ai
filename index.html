<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<title>ai</title>
<style>
  :root {
    --bg: #faf9f5;
    --ink: #1f1e1d;
    --sub: #6b6a64;
    --line: #e6e4dc;
    --bubble: #efede4;
    --card: #ffffff;
    --hover: #f0eee6;
    --accent: #c96442;
    --accent-ink: #ffffff;
    --danger: #b3412e;
    --shadow: 0 2px 12px rgba(31, 30, 29, .08);
    --sans: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    --serif: ui-serif, "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262624;
      --ink: #f0eee6;
      --sub: #a09f97;
      --line: #3c3b37;
      --bubble: #35342f;
      --card: #30302e;
      --hover: #34332f;
      --accent: #d97757;
      --accent-ink: #1f1e1d;
      --danger: #e8806a;
      --shadow: 0 2px 12px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--ink); font: 16px/1.7 var(--sans); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 全体: 狭い画面は1カラム＋左から出る記憶パネル、広い画面は常時表示 */
  #app { height: var(--app-h, 100dvh); display: flex; overflow: hidden; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  header.bar {
    display: flex; align-items: center; gap: 4px;
    padding: calc(6px + env(safe-area-inset-top)) 8px 6px;
  }
  header.bar h1 { flex: 1; margin: 0; font: 500 1.25rem var(--serif); letter-spacing: .06em; }
  .icon {
    width: 44px; height: 44px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 12px; color: var(--sub);
  }
  .icon:hover { background: var(--hover); color: var(--ink); }
  .icon svg { width: 22px; height: 22px; }

  /* 会話 */
  #thread { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 8px 16px 16px; }
  .col { max-width: 46rem; margin: 0 auto; }

  #hello { text-align: center; padding: 14vh 8px 0; }
  #hello h2 { font: 400 1.7rem/1.4 var(--serif); margin: 0 0 8px; }
  #hello p { color: var(--sub); margin: 0 0 20px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip {
    min-height: 44px; padding: 8px 16px; background: none;
    border: 1px solid var(--line); border-radius: 999px;
  }
  .chip:hover { background: var(--hover); }

  .msg { margin: 18px 0; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .body {
    max-width: 85%; background: var(--bubble); border-radius: 18px;
    padding: 9px 15px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.ai .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.ai .title { font: 600 1.05rem var(--serif); letter-spacing: .03em; margin-bottom: 2px; display: block; }
  .msg.ai .sub { color: var(--sub); font-size: .9rem; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .actions button {
    min-height: 44px; padding: 8px 16px; background: none;
    border: 1px solid var(--line); border-radius: 12px;
  }
  .actions button:hover:not(:disabled) { background: var(--hover); }
  .actions button.main { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .actions button:disabled { opacity: .45; cursor: default; }

  /* 入力欄（下に固定） */
  #composer { padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); }
  .box {
    max-width: 46rem; margin: 0 auto; display: flex; align-items: flex-end; gap: 4px;
    background: var(--card); border: 1px solid var(--line); border-radius: 26px;
    padding: 6px 6px 6px 16px; box-shadow: var(--shadow);
  }
  .box:focus-within { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  textarea#input {
    flex: 1; min-width: 0; resize: none; border: 0; background: none; color: var(--ink);
    font: inherit; font-size: 16px; /* 16px未満だとiOSが拡大表示する */
    line-height: 1.55; padding: 9px 0; min-height: 44px; max-height: 40vh;
  }
  textarea#input:focus-visible { outline: none; }
  textarea#input::placeholder { color: var(--sub); }
  #send {
    width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
  }
  #send:disabled { opacity: .35; cursor: default; }
  #send svg { width: 20px; height: 20px; }
  #hint { max-width: 46rem; margin: 6px auto 0; text-align: center; font-size: .78rem; color: var(--sub); }

  /* 記憶パネル */
  #drawer {
    width: min(88vw, 24rem); background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; flex: none;
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
    transform: translateX(-100%); transition: transform .2s ease;
    padding-top: env(safe-area-inset-top);
  }
  #drawer.open { transform: none; box-shadow: var(--shadow); }
  #scrim { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0, 0, 0, .35); z-index: 10; display: none; }
  #scrim.show { display: block; }
  @media (prefers-reduced-motion: reduce) { #drawer { transition: none; } }

  .dhead { display: flex; align-items: center; padding: 6px 8px 0 16px; }
  .dhead h2 { flex: 1; margin: 0; font: 500 1.1rem var(--serif); letter-spacing: .06em; }
  .dtools { padding: 8px 16px 4px; }
  #search {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 44px;
  }
  #count { padding: 0 16px 6px; font-size: .85rem; color: var(--sub); }
  #terms { list-style: none; margin: 0; padding: 0 8px calc(16px + env(safe-area-inset-bottom)); overflow-y: auto; flex: 1; }
  #terms li { padding: 10px 8px; border-radius: 12px; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; }
  #terms li:hover { background: var(--hover); }
  #terms .term { font: 600 1rem var(--serif); letter-spacing: .03em; overflow-wrap: anywhere; }
  #terms .def { grid-column: 1; margin: 0; font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
  #terms .meta { grid-column: 1; font-size: .78rem; color: var(--sub); overflow-wrap: anywhere; }
  #terms .del {
    grid-column: 2; grid-row: 1 / span 3; align-self: center; min-height: 44px; min-width: 44px;
    padding: 6px 12px; background: none; border: 1px solid transparent; border-radius: 12px;
    color: var(--sub); font-size: .85rem;
  }
  #terms .del:hover { color: var(--danger); border-color: var(--line); }
  #terms .del.armed { color: var(--danger); border-color: var(--danger); }
  #empty { padding: 24px 16px; color: var(--sub); text-align: center; }

  /* 何か壊れたときに、画面に理由を出す（スマホでは開発者ツールが使えないため） */
  #fatal {
    position: fixed; left: 0; right: 0; top: 0; z-index: 100; display: none;
    padding: calc(10px + env(safe-area-inset-top)) 16px 12px;
    background: var(--danger); color: #fff; font-size: .9rem; line-height: 1.5;
  }
  #fatal.show { display: block; }
  #fatal button { margin-top: 8px; min-height: 44px; padding: 8px 16px; background: #fff; color: #222; border: 0; border-radius: 10px; }
  #fatal code { display: block; margin-top: 6px; font-size: .75rem; opacity: .9; overflow-wrap: anywhere; }

  @media (min-width: 900px) {
    #drawer { position: static; transform: none; width: 22rem; box-shadow: none; z-index: auto; }
    #scrim { display: none !important; }
    #menu, #close { display: none; }
  }
</style>
</head>
<body>
<div id="fatal" role="alert">
  <span id="fatal-msg"></span>
  <code id="fatal-detail"></code>
  <button type="button" onclick="location.reload()">再読み込み</button>
</div>
<script>
  // どこかで例外が起きたら、黙って固まらずに画面に出す
  (function () {
    function show(message, detail) {
      var box = document.getElementById('fatal');
      if (!box) return;
      document.getElementById('fatal-msg').textContent = message;
      document.getElementById('fatal-detail').textContent = detail || '';
      box.classList.add('show');
    }
    window.__showFatal = show;
    window.addEventListener('error', function (e) {
      show('うまく動きませんでした。再読み込みで直ることがあります。',
        (e.message || '') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      show('うまく動きませんでした。再読み込みで直ることがあります。', String((e.reason && e.reason.message) || e.reason));
    });
  })();
</script>
<div id="app">
  <aside id="drawer" aria-label="記憶" inert>
    <div class="dhead">
      <h2>記憶</h2>
      <button class="icon" id="close" type="button" aria-label="閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="dtools"><input id="search" type="search" placeholder="記憶を探す" aria-label="記憶を探す"></div>
    <div id="count"></div>
    <ul id="terms"></ul>
    <p id="empty" hidden></p>
  </aside>
  <div id="scrim"></div>

  <div id="main">
    <header class="bar">
      <button class="icon" id="menu" type="button" aria-label="記憶を開く" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1>ai</h1>
      <button class="icon" id="reset" type="button" aria-label="新しい会話">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <div id="thread">
      <div class="col" id="messages" aria-live="polite">
        <div id="hello">
          <h2>何を覚えさせますか？</h2>
          <p>「AI = 人工知能」と送ると覚えます。<br>「AIとは？」と聞くと答えます。</p>
          <div class="chips">
            <button class="chip" type="button" data-fill="AI = 人工知能">AI = 人工知能</button>
            <button class="chip" type="button" data-fill="AIとは？">AIとは？</button>
          </div>
        </div>
      </div>
    </div>

    <form id="composer" autocomplete="off">
      <div class="box">
        <textarea id="input" rows="1" placeholder="覚えさせる・聞く" aria-label="メッセージ" enterkeyhint="send"></textarea>
        <button id="send" type="submit" aria-label="送る" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div id="hint">記憶はこの端末の中だけに保存されます</div>
    </form>
  </div>
</div>

<script src="js/normalize.js?v=0.3.0"></script>
<script src="js/db.js?v=0.3.0"></script>
<script src="js/terms.js?v=0.3.0"></script>
<script src="js/chat.js?v=0.3.0"></script>
<script src="js/wiki.js?v=0.3.0"></script>
<script src="js/app.js?v=0.3.0"></script>
</body>
</html>
